services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      # Overrides whatever PANEL_DB_URL is in .env so the panel SQLite file
      # always lands in the mounted volume below, regardless of local dev value.
      PANEL_DB_URL: file:./data/panel.db
    volumes:
      - panel-data:/app/data
    restart: unless-stopped

volumes:
  panel-data:
