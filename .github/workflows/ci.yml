name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Format check
        run: bun run lint

      - name: Dead code check
        run: bun run knip

      - name: Build
        run: bun run build
